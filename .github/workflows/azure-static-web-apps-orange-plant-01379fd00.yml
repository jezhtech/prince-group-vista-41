name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - events
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - events

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Optional: Add this if your project requires npm build
      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_PLANT_01379FD00 }}
          action: "upload"
          app_location: "/"           # Change if your app is inside a folder
          api_location: ""            # Leave empty if no API
          output_location: "dist"    # Update to dist/build/output folder name

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
